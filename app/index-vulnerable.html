<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <title>Laboratório Base64 - Versão Vulnerável</title>
</head>

<body>

  <h1>Laboratório Base64 - Versão Vulnerável</h1>

  <p>
    Ambiente de laboratório para demonstração
    controlada de vulnerabilidade XSS.
  </p>

  <label for="texto">Digite um texto:</label>

  <input
    id="texto"
    data-cy="entrada"
    type="text"
  >

  <button data-cy="codificar" type="button">
    Codificar
  </button>

  <button data-cy="decodificar" type="button">
    Decodificar
  </button>

  <p>
    Resultado:
    <span data-cy="resultado"></span>
  </p>

  <script>

    // ===========================================
    // ELEMENTOS DA APLICAÇÃO
    // ===========================================

    const entrada = document.querySelector(
      '[data-cy="entrada"]'
    );

    const resultado = document.querySelector(
      '[data-cy="resultado"]'
    );


    // ===========================================
    // CODIFICAÇÃO BASE64
    // ===========================================

    document.querySelector('[data-cy="codificar"]')
      .addEventListener('click', () => {

        try {

          // Converter texto para bytes UTF-8
          const bytes = new TextEncoder().encode(
            entrada.value
          );

          // Converter bytes para string binária
          const binario = Array.from(
            bytes,
            byte => String.fromCharCode(byte)
          ).join('');

          // Codificar Base64
          resultado.textContent = btoa(binario);

        } catch (erro) {

          resultado.textContent = 'Erro na codificação';

        }

      });


    // ===========================================
    // DECODIFICAÇÃO BASE64
    // VULNERABILIDADE XSS INTENCIONAL
    // ===========================================

    document.querySelector('[data-cy="decodificar"]')
      .addEventListener('click', () => {

        try {

          // Decodificar Base64
          const binario = atob(entrada.value);

          // Converter resultado para bytes
          const bytes = Uint8Array.from(
            binario,
            caractere => caractere.charCodeAt(0)
          );

          // Recuperar texto UTF-8
          const texto = new TextDecoder('utf-8', {
            fatal: true
          }).decode(bytes);


          // =====================================
          // FALHA DE SEGURANÇA INTENCIONAL
          // =====================================
          //
          // innerHTML interpreta o conteúdo
          // recebido como HTML.
          //
          // Se o texto contiver elementos com
          // manipuladores de eventos JavaScript,
          // eles poderão ser executados.
          //
          // Esta falha existe exclusivamente
          // para o experimento de segurança.
          //
          // A versão segura utiliza:
          //
          // resultado.textContent = texto;
          //
          // =====================================

          resultado.innerHTML = texto;

        } catch (erro) {

          // Tratamento de entradas inválidas
          resultado.textContent = 'Erro na decodificação';

        }

      });

  </script>

</body>
</html>
